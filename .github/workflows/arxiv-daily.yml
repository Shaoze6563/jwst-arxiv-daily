name: Daily JWST galaxy arXiv digest

on:
  schedule:
    # GitHub cron uses UTC: 02:00 UTC = 10:00 Asia/Singapore.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect papers
        run: python collector.py

      - name: Commit new report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/seen.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: add daily arXiv digest"
            git push
          fi
